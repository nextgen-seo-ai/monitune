<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="ad.size" content="width=300,height=600">
<meta name="viewport" content="width=300,initial-scale=1">
<title>MoniTune google en 300x600 number-counter</title>
<style>
*{box-sizing:border-box}html,body{margin:0;width:100%;height:100%;overflow:hidden;background:#090d0f}
body{font-family:"Segoe UI",Arial,sans-serif;color:#eee}
.banner{position:relative;width:300px;height:600px;overflow:hidden;background:
radial-gradient(circle at 78% 42%,rgba(255,177,0,.18),transparent 34%),
linear-gradient(145deg,#080c0e 0%,#0b1013 58%,#100d08 100%);isolation:isolate}
.hero{position:absolute;z-index:0;object-fit:cover;object-position:center;mix-blend-mode:screen;filter:saturate(.9) contrast(1.05)}
.vignette{position:absolute;inset:0;z-index:1;background:linear-gradient(90deg,rgba(4,8,10,.96) 0%,rgba(4,8,10,.76) 43%,rgba(4,8,10,.22) 72%,rgba(4,8,10,.55) 100%)}
.light-overlay,.night-overlay{display:none;position:absolute;inset:0;z-index:2;pointer-events:none;background:rgba(0,0,0,.7)}
.sweep{display:none;position:absolute;z-index:6;top:-25%;left:0;width:25%;height:150%;background:linear-gradient(90deg,transparent,rgba(255,190,30,.28),rgba(255,240,180,.5),transparent);filter:blur(4px);pointer-events:none}
.brand{position:absolute;z-index:8;display:flex;align-items:center}
.brand-name{font-weight:700;letter-spacing:-.04em;color:#f3ead8}
.copy{position:absolute;z-index:8}
.headline{font-family:"Segoe UI Light","Segoe UI",Arial,sans-serif;font-weight:300;letter-spacing:-.055em;color:#f1eadc;text-transform:uppercase}
.headline .accent,.accent{color:#ffb900;font-weight:420}
.sub{color:#c9bea9;font-weight:350}
.features{display:flex;flex-wrap:wrap}
.feature{border:1px solid rgba(255,255,255,.13);background:rgba(11,16,18,.72);border-radius:9px;color:#e8dfcf;white-space:nowrap}
.feature b{color:#ffb900}
.visual{position:absolute;z-index:7}
.ui-card{position:absolute;background:linear-gradient(180deg,rgba(17,22,24,.96),rgba(12,16,18,.96));border:1px solid rgba(255,210,90,.18);box-shadow:0 18px 35px rgba(0,0,0,.33);overflow:hidden}
.ui-top{display:flex;align-items:center;justify-content:space-between}
.ui-brand{display:flex;align-items:center;gap:5px}
.ui-dot-sun{width:12px;height:12px;border-radius:50%;background:#ffb900;box-shadow:0 0 9px rgba(255,185,0,.45)}
.ui-title{font-weight:650;color:#f2eadb}
.ui-icons{color:#ddd;font-size:.85em;letter-spacing:.2em}
.toggle-row{display:flex;gap:7px;align-items:center;margin-top:8px;color:#d6cdbd}
.toggle{width:28px;height:14px;border:1px solid #ffb900;border-radius:20px;position:relative;background:rgba(255,185,0,.08)}
.toggle .dot{position:absolute;top:2px;left:2px;width:8px;height:8px;border-radius:50%;background:#ffb900;box-shadow:0 0 8px rgba(255,185,0,.5)}
.monitor-card{border:1px solid rgba(255,255,255,.08);border-radius:8px;background:rgba(255,255,255,.02)}
.monitor-name{font-weight:650;color:#f1eadc}
.slider-row{display:grid;grid-template-columns:auto 1fr auto;gap:5px;align-items:center;margin-top:5px}
.row-label,.row-value{color:#c7bdad}
.track{position:relative;height:4px;border-radius:5px;background:rgba(255,255,255,.22)}
.track::before{content:"";position:absolute;left:0;top:0;bottom:0;width:72%;background:#ffb900;border-radius:5px}
.knob{position:absolute;top:-4px;left:72%;width:12px;height:12px;border:2px solid #f8f0df;border-radius:50%;background:#151a1c;transform:translateX(-50%)}
.small-detail{color:#7f8585;margin-top:5px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.big-slider{position:absolute;background:linear-gradient(180deg,rgba(23,27,28,.96),rgba(17,18,16,.96));border:1px solid rgba(255,255,255,.11);overflow:hidden;box-shadow:0 0 28px rgba(255,178,0,.13);pointer-events:none}
.big-slider .fill{position:absolute;left:0;right:0;bottom:0;height:78%;background:linear-gradient(180deg,#ffe98d 0%,#ffbd05 35%,#9b5b00 100%);box-shadow:0 0 20px rgba(255,183,0,.32) inset}
.big-slider .handle{position:absolute;left:12%;right:12%;top:22%;height:7px;border-radius:7px;background:#fff6dc;box-shadow:0 1px 8px rgba(255,255,255,.5)}
.percent{position:absolute;color:#f3ebdc;font-family:"Segoe UI Light","Segoe UI";font-weight:300;text-align:center}
.percent small{font-size:.35em;color:#bcb3a4}
.hero{position:absolute}
.cta{position:absolute;z-index:10;border:0;background:linear-gradient(180deg,#ffc51e,#ffad00);color:#080b0c;font-weight:750;text-decoration:none;text-align:center;box-shadow:0 8px 25px rgba(255,170,0,.24);overflow:hidden}
.cta::after{content:"";display:none;position:absolute;top:-30%;bottom:-30%;width:24%;left:0;background:rgba(255,255,255,.45);filter:blur(5px)}
.footer{position:absolute;z-index:8;color:#7e8587;white-space:nowrap}
.day-icon{display:inline-block;color:#ffb900}
#click-area{position:absolute;inset:0;z-index:30;cursor:pointer}

        .brand{left:24px;top:27px;gap:8px}
        .brand .sun-logo{width:36px;height:36px}
        .brand-name{font-size:27px}
        .copy{left:24px;top:96px;width:228px}
        .headline{font-size:30px;line-height:1.02}
        .sub{font-size:13px;margin-top:7px}
        .features{margin-top:10px;gap:6px}
        .feature{font-size:11px;padding:6px 8px}
        .visual{left:18px;top:270px;width:264px;height:234px}
        .ui-card{left:0;bottom:0;width:216px;height:186px;padding:10px;border-radius:13px}
        .ui-title{font-size:16px}
        .monitor-card{padding:7px;margin-top:4px}
        .monitor-name{font-size:12px}
        .row-label,.row-value{font-size:9px}
        .small-detail{font-size:7px}
        .big-slider{right:9px;top:0;width:54px;height:180px;border-radius:27px}
        .big-slider .handle{height:5px}
        .percent{right:15px;top:186px;font-size:36px}
        .hero{right:-6%;bottom:66px;width:72%;height:48%;opacity:.88}
        .cta{left:24px;right:24px;bottom:21px;padding:10px 10px;font-size:21px;border-radius:13px}
        .footer{display:none}
        

    @keyframes fadeUp{0%{opacity:0;transform:translateY(10px)}100%{opacity:1;transform:translateY(0)}}
    @keyframes sliderMove{0%{transform:translateY(24%)}55%,100%{transform:translateY(-26%)}}
    @keyframes sliderFill{0%{height:35%}55%,100%{height:78%}}
    @keyframes rowKnob{0%{left:28%}55%,100%{left:72%}}
    @keyframes pulse{0%,65%,100%{transform:scale(1)}75%{transform:scale(1.045);box-shadow:0 0 25px rgba(255,185,0,.38)}85%{transform:scale(1)}}
    @keyframes shimmer{0%,70%{transform:translateX(-160%) skewX(-20deg)}90%,100%{transform:translateX(190%) skewX(-20deg)}}
    @keyframes reveal{0%{opacity:.76}55%,100%{opacity:.12}}
    @keyframes sweep{0%{transform:translateX(-180%) rotate(8deg)}70%,100%{transform:translateX(260%) rotate(8deg)}}
    @keyframes parallaxHero{0%{transform:scale(1.06) translateX(2%)}100%{transform:scale(1) translateX(-1%)}}
    @keyframes parallaxUI{0%{transform:translate(8px,6px)}100%{transform:translate(0,0)}}
    @keyframes nightWarm{0%{opacity:.8;background:rgba(12,30,65,.72)}55%,100%{opacity:.08;background:rgba(255,170,0,.08)}}
    @keyframes moonSun{0%{transform:rotate(-30deg);opacity:1}48%{transform:rotate(40deg);opacity:0}52%{transform:rotate(-40deg);opacity:0}100%{transform:rotate(0);opacity:1}}
    
        .big-slider .fill{animation:sliderFill 3.1s ease .7s both}
        .big-slider .handle{animation:sliderMove 3.1s ease .7s both}
        .monitor-card .knob{animation:rowKnob 3.1s ease .7s both}
        .cta{animation:pulse 6s ease 1.3s both}
        
@media(prefers-reduced-motion:reduce){*{animation:none!important;transition:none!important}}
</style>
</head>
<body>
<div class="banner">
  <img class="hero" src="hero.jpg" alt="">
  <div class="vignette"></div>
  <div class="light-overlay"></div>
  <div class="night-overlay"></div>
  <div class="sweep"></div>

  <div class="brand">
    <svg class="sun-logo" width="42" height="42" viewBox="0 0 100 100" aria-hidden="true">
      <g fill="#ffb900">
        <circle cx="50" cy="50" r="22"></circle>
        <rect x="45" y="2" width="10" height="24" rx="5"></rect>
        <rect x="45" y="74" width="10" height="24" rx="5"></rect>
        <rect x="2" y="45" width="24" height="10" rx="5"></rect>
        <rect x="74" y="45" width="24" height="10" rx="5"></rect>
        <rect x="14" y="14" width="10" height="25" rx="5" transform="rotate(-45 19 26.5)"></rect>
        <rect x="76" y="61" width="10" height="25" rx="5" transform="rotate(-45 81 73.5)"></rect>
        <rect x="61" y="14" width="10" height="25" rx="5" transform="rotate(45 66 26.5)"></rect>
        <rect x="29" y="61" width="10" height="25" rx="5" transform="rotate(45 34 73.5)"></rect>
      </g>
    </svg><div class="brand-name">MoniTune</div></div>

  <div class="copy">
    <div class="headline">EVERY MONITOR'S BRIGHTNESS<br><span class="accent">FROM ONE SLIDER</span></div>
    <div class="sub">Control from the Windows tray</div>
    <div class="features">
      <div class="feature"><b><span class="day-icon">☾</span></b>&nbsp; Night mode</div>
      <div class="feature"><b>✓</b>&nbsp; No telemetry</div>
    </div>
  </div>

  <div class="visual">
    <div class="big-slider"><div class="fill"></div><div class="handle"></div></div>
    <div class="percent"><span class="percent-number">78</span><small>%</small></div>
    <div class="ui-card">
      <div class="ui-top"><div class="ui-brand"><span class="ui-dot-sun"></span><span class="ui-title">MoniTune</span></div><span class="ui-icons">↻ ☾ ⚙</span></div>
      <div class="toggle-row"><span class="toggle"><span class="dot"></span></span><span class="row-label">Sync</span></div>
      <div class="monitor-card">
        <div class="monitor-name">Samsung LU28R55</div>
        <div class="slider-row"><span class="row-label">Brightness</span><span class="track"><span class="knob"></span></span><span class="row-value">78%</span></div>
        <div class="slider-row"><span class="row-label">Contrast</span><span class="track"><span class="knob" style="left:58%"></span></span><span class="row-value">58%</span></div>
        <div class="small-detail">DisplayPort → Samsung LU28R55</div>
      </div>
      <div class="monitor-card">
        <div class="monitor-name">LG 23EA53</div>
        <div class="slider-row"><span class="row-label">Brightness</span><span class="track"><span class="knob"></span></span><span class="row-value">78%</span></div>
        <div class="small-detail">HDMI → LG 23EA53</div>
      </div>
    </div>
  </div>

  <div id="cta" class="cta">Download now! &nbsp; ↓</div>
  <div class="footer">Windows 11 / 10  •  Open source</div>
  <a id="click-area" href="#" target="_blank" rel="noopener" aria-label="Download now!"></a>
</div>

        <script>
        window.clickTag = "https://nextgen-seo-ai.github.io/monitune/en/";
        document.addEventListener('DOMContentLoaded', function(){
          document.getElementById('click-area').href = window.clickTag;
        });
        </script>
        

        <script>
        document.addEventListener('DOMContentLoaded', function(){
          const n=document.querySelector('.percent-number'); let start=null;
          function tick(ts){if(!start) start=ts; let p=Math.min(1,(ts-start)/2300); let v=Math.round(28+(78-28)*(1-Math.pow(1-p,3))); n.textContent=v; if(p<1)requestAnimationFrame(tick);}
          setTimeout(()=>requestAnimationFrame(tick),650);
        });
        </script>
        

</body>
</html>
